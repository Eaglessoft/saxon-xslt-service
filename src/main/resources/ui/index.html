  <script>/* applied before first paint so a stored choice never flashes the other theme */
(function(){try{var t=localStorage.getItem("dn-theme");
if(t!=="dark"&&t!=="light")return;
document.documentElement.setAttribute("data-theme",t);
/* the two metas above are keyed to the OS, which an explicit choice overrides.
   Give BOTH the chosen colour so whichever one matches reports the right one. */
var c=t==="dark"?"#0e1526":"#f1f5fd",m=document.querySelectorAll('meta[name="theme-color"]');
for(var i=0;i<m.length;i++)m[i].setAttribute("content",c);}catch(e){}})();</script>

  <!-- CodeMirror 6 is ESM and normally expects a bundler. The "*" prefix makes
       esm.sh emit bare specifiers instead of hardcoded URLs, so THIS map is
       what resolves them - which is the whole point. CodeMirror checks
       instance identity, and two copies of @codemirror/state (exactly what
       unpinned CDN builds produce: jsdelivr's +esm pulls 6.0.1, 6.4.0 and
       6.4.1 at once) make every extension fail with "Unrecognized extension
       value". Every version below is pinned for that reason - do not loosen
       them without re-checking that only one state module is fetched. -->
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state": "https://esm.sh/*@codemirror/state@6.4.1",
      "@codemirror/view": "https://esm.sh/*@codemirror/view@6.26.3",
      "@codemirror/language": "https://esm.sh/*@codemirror/language@6.10.1",
      "@codemirror/commands": "https://esm.sh/*@codemirror/commands@6.5.0",
      "@codemirror/search": "https://esm.sh/*@codemirror/search@6.5.6",
      "@codemirror/lang-xml": "https://esm.sh/*@codemirror/lang-xml@6.1.0",
      "@lezer/common": "https://esm.sh/*@lezer/common@1.2.1",
      "@lezer/highlight": "https://esm.sh/*@lezer/highlight@1.2.0",
      "@lezer/lr": "https://esm.sh/*@lezer/lr@1.4.0",
      "@lezer/xml": "https://esm.sh/*@lezer/xml@1.0.5",
      "style-mod": "https://esm.sh/*style-mod@4.1.2",
      "w3c-keyname": "https://esm.sh/*w3c-keyname@2.2.8",
      "crelt": "https://esm.sh/*crelt@1.0.6"
    }
  }
  </script>

  <script>
(function(){
  var btn=document.querySelector(".theme-toggle"); if(!btn) return;
  var mq=window.matchMedia("(prefers-color-scheme: dark)"), root=document.documentElement;
  /* No stored choice means follow the OS, so read the attribute first and only
     fall back to the media query - never stamp an attribute on load. */
  function current(){return root.getAttribute("data-theme")||(mq.matches?"dark":"light");}
  function sync(){
    var dark=current()==="dark";
    btn.setAttribute("aria-label",dark?"Switch to light theme":"Switch to dark theme");
    btn.setAttribute("aria-pressed",String(dark));
    /* keep the browser chrome on the theme actually showing, not on the OS one */
    var c=dark?"#0e1526":"#f1f5fd",m=document.querySelectorAll('meta[name="theme-color"]');
    for(var i=0;i<m.length;i++)m[i].setAttribute("content",c);
  }
  btn.addEventListener("click",function(){
    var next=current()==="dark"?"light":"dark";
    root.setAttribute("data-theme",next);
    try{localStorage.setItem("dn-theme",next);}catch(e){}
    sync();
  });
  if(mq.addEventListener)mq.addEventListener("change",sync);
  sync();
})();
  </script>
